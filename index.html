const SUPPORTED=["en","ar","ur","fr","tr","fa","bn","id","ms","so","az","kk","uz","sq","ru"];

const REASONS=["Overslept","Forgot","Work / study","Travel","Family responsibilities","No suitable place","Lost track of time","Low motivation","Health / personal circumstances","Intentionally delayed","Other"];
const METHODS=[["Auto / country default",4],["Muslim World League",3],["Umm Al-Qura, Makkah",4],["Egyptian General Authority",5],["Karachi",1],["Dubai",8],["Moonsighting Committee",15]];

const FALLBACK=["5:10 AM","12:45 PM","4:10 PM","6:55 PM","8:25 PM"];
const KEY="salah_recovery_pro_v3";
let d=JSON.parse(localStorage.getItem(KEY)||"null")||{
 country:"Pakistan",langMode:"country",lang:"ur",madhab:"Hanafi",theme:"light",page:"today",onboard:false,records:[],qaza:{},times:{},notes:[],notifications:false,ramadan:false,fasting:{},tasbeeh:0,goals:{daily:5},firstDay:null
};
let modal=null,selected=null,reason="",note="",toastTimer=null;

function T(k){let L=LANG[d.lang]||LANG.en;return L[k]||LANG.en[k]||k}
function country(){return COUNTRIES.find(x=>x[0]===d.country)||COUNTRIES[0]}
function todayKey(dt=new Date()){let y=dt.getFullYear(),m=String(dt.getMonth()+1).padStart(2,"0"),day=String(dt.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function parseDate(s){let [y,m,day]=s.split("-").map(Number);return new Date(y,m-1,day)}
function fmt(s,opt={month:"short",day:"numeric",year:"numeric"}){return parseDate(s).toLocaleDateString(d.lang||undefined,opt)}
function save(){localStorage.setItem(KEY,JSON.stringify(d))}
function toast(msg){clearTimeout(toastTimer);let e=document.createElement("div");e.className="toast";e.textContent=msg;document.body.appendChild(e);toastTimer=setTimeout(()=>e.remove(),2400)}
function recordsFor(day=todayKey()){return d.records.filter(r=>r.date===day)}
function rec(day,p){return d.records.find(r=>r.date===day&&r.prayer===p)}
function timesFor(day=todayKey()){return d.times[day]||Object.fromEntries(PRAYERS.map((p,i)=>[p,FALLBACK[i]]))}
function toMinutes(t){let m=String(t).match(/(\d+):(\d+)\s*(AM|PM)/i);if(!m)return 0;let h=+m[1],mi=+m[2];if(m[3].toUpperCase()==="PM"&&h<12)h+=12;if(m[3].toUpperCase()==="AM"&&h===12)h=0;return h*60+mi}
function prayerState(p,day=todayKey()){
 let r=rec(day,p);if(r?.status==="completed")return "completed";
 if(r?.status==="missed")return r.recovery==="completed"?"recovered":r.recovery==="planned"?"planned":"missed";
 if(day!==todayKey())return "untracked";
 let n=new Date(),now=n.getHours()*60+n.getMinutes(),t=toMinutes(timesFor(day)[p]);
 return t<now?"past":"upcoming";
}
function setRecord(day,p,status,rs="",nn=""){
 d.records=d.records.filter(x=>!(x.date===day&&x.prayer===p));
 d.records.push({date:day,prayer:p,status,recovery:"none",reason:rs,note:nn});
 save()
}
function completedToday(){return recordsFor().filter(r=>r.status==="completed").length}
function missedToday(){return recordsFor().filter(r=>r.status==="missed"&&r.recovery!=="completed").length}
function recoveredCount(){return d.records.filter(r=>r.recovery==="completed").length}
function calcStreak(){
 let s=0,dt=new Date();
 while(true){let k=todayKey(dt),c=recordsFor(k).filter(r=>r.status==="completed").length;if(c<5)break;s++;dt.setDate(dt.getDate()-1);if(s>999)break}
 return s
}
function completionRate(){
 let all=d.records.filter(r=>r.status==="completed"||r.status==="missed");return all.length?Math.round(all.filter(r=>r.status==="completed").length/all.length*100):0
}
function nextPrayer(){
 let now=new Date(),mins=now.getHours()*60+now.getMinutes(),ts=timesFor(),idx=PRAYERS.findIndex(p=>toMinutes(ts[p])>mins);
 if(idx<0)return {p:"Fajr",time:ts.Fajr,tomorrow:true};return {p:PRAYERS[idx],time:ts[PRAYERS[idx]],tomorrow:false}
}
function qazaTotal(){return Object.values(d.qaza||{}).reduce((a,b)=>a+Number(b||0),0)}
function qazaRemaining(){return Math.max(0,qazaTotal()-recoveredCount())}
function setQaza(p,n){d.qaza[p]=Math.max(0,Number(n)||0);save()}
function addQaza(){selected=PRAYERS[0];modal="qaza";render()}
function calculateQibla(lat,lon){
 const kaabaLat=21.422487,kaabaLon=39.826206,rad=Math.PI/180;
 let φ1=lat*rad,φ2=kaabaLat*rad,dl=(kaabaLon-lon)*rad;
 let br=Math.atan2(Math.sin(dl),Math.cos(φ1)*Math.tan(φ2)-Math.sin(φ1)*Math.cos(dl))/rad;
 return (br+360)%360
}
function countryMethod(){
 let c=d.country;
 if(["Saudi Arabia","Palestine","Jordan","Qatar","Kuwait","Bahrain","Oman","United Arab Emirates"].includes(c))return 4;
 if(["Egypt","Sudan","Syria","Lebanon","Iraq","Libya","Tunisia","Algeria","Morocco"].includes(c))return 5;
 if(["Pakistan","Bangladesh","India"].includes(c))return 1;
 if(["Turkey"].includes(c))return 13;
 if(["Indonesia","Malaysia","Singapore"].includes(c))return 20;
 return 3
}
function countryLang(){return country()[5]||"en"}
function countryCode(){return country()[1]}
function applyCountry(){
 d.lang=d.langMode==="country"?countryLang():d.lang;d.times={};save();render();refreshTimes(true)
}
async function refreshTimes(silent=false){
 let c=country(),method=countryMethod(),school=d.madhab==="Hanafi"?1:0;
 let k=todayKey(),url=`https://api.aladhan.com/v1/timings/${k}?latitude=${c[3]}&longitude=${c[4]}&method=${method}&school=${school}`;
 try{let res=await fetch(url);let j=await res.json(),t=j?.data?.timings;if(t){d.times[k]={Fajr:t.Fajr,Dhuhr:t.Dhuhr,Asr:t.Asr,Maghrib:t.Maghrib,Isha:t.Isha};save();if(!silent){toast(T("prayerTimes")+" ✓");render()}}}
 catch(e){if(!silent){toast("Offline mode: showing safe fallback times");render()}}
}
function markPrayer(p){selected=p;modal="prayer";render()}
function completePrayer(){setRecord(todayKey(),selected,"completed");modal=null;toast(selected+" ✓");render()}
function recordMissed(){if(!reason){toast(T("chooseReason"));return}let el=document.getElementById("reasonNote");setRecord(todayKey(),selected,"missed",reason,el?el.value:"");modal=null;reason="";toast(T("missed"));render()}
function planQaza(p){let x=rec(todayKey(),p);if(x){x.recovery="planned";save()}else{setRecord(todayKey(),p,"missed");let r=rec(todayKey(),p);r.recovery="planned";save()}toast(T("plan"));render()}
function completeQaza(p){let r=d.records.find(x=>x.status==="missed"&&x.prayer===p&&x.recovery!=="completed");if(r){r.recovery="completed";save();toast(T("recovered"));render()}else{d.qaza[p]=Math.max(0,(d.qaza[p]||0)-1);save();toast(T("recovered"));render()}}
function toggleFast(){
 let k=todayKey();d.fasting[k]=!d.fasting[k];save();render()
}
function tasbeeh(delta){d.tasbeeh=Math.max(0,d.tasbeeh+delta);save();render()}
function exportData(){let b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="salah-recovery-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast(T("export"))}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.records||!x.qaza)throw 0;d=x;save();toast(T("import"));render()}catch{toast("Invalid backup file")}};r.readAsText(f)}
function toggleNotifications(on){
 d.notifications=on;save();
 if(on&&"Notification"in window)Notification.requestPermission().then(p=>{if(p!=="granted"){d.notifications=false;save();toast("Permission not granted")}else toast(T("reminders"))});
 else if(on&&!window.Notification){d.notifications=false;save();toast("Notifications unavailable")}
 else toast(T("reminders"));
 render()
}
function reminderCheck(){
 if(!d.notifications||!("Notification"in window)||Notification.permission!=="granted")return;
 let now=new Date(),mins=now.getHours()*60+now.getMinutes(),ts=timesFor();
 let p=PRAYERS.find(x=>Math.abs(toMinutes(ts[x])-mins)<1);
 if(p){let key="sr_"+todayKey()+"_"+p;if(!sessionStorage.getItem(key)){new Notification("Salah Recovery",{body:p+" — "+T("next")});sessionStorage.setItem(key,"1")}}
}
function resetData(){if(confirm(T("danger")+"?")){localStorage.removeItem(KEY);location.reload()}}
function nav(page){d.page=page;save();render()}
function setLangChoice(v){
 if(v==="country"){d.langMode="country";d.lang=countryLang()}
 else {d.langMode="manual";d.lang=v}
 save();render()
}
function setLanguage(v){d.lang=v;d.langMode="manual";save();render()}
function useGeo(){
 if(!navigator.geolocation){toast("Location unavailable");return}
 navigator.geolocation.getCurrentPosition(pos=>{
   let best=COUNTRIES[0],dist=1e9;
   COUNTRIES.forEach(c=>{let x=(c[3]-pos.coords.latitude)**2+(c[4]-pos.coords.longitude)**2;if(x<dist){dist=x;best=c}});
   d.country=best[0];d.langMode="country";d.lang=countryLang();d.times={};save();toast(T("location")+" ✓");render();refreshTimes(true)
 },()=>toast("Location permission was not granted"))
}

function shell(content){
 document.body.className=d.theme==="dark"?"dark":"";
 document.documentElement.lang=d.lang||"en";document.documentElement.dir=(LANG[d.lang]?.dir||"ltr");
 return `<div class="app">
 <header class="top"><div><div class="brand">☾ ${T("title")}</div><div class="date">${new Date().toLocaleDateString(d.lang,{weekday:"long",month:"long",day:"numeric"})} · ${country()[0]}</div></div><button class="iconbtn" onclick="d.theme=d.theme==='dark'?'light':'dark';save();render()" aria-label="theme">${d.theme==="dark"?"☀️":"🌙"}</button></header>
 ${content}
 <nav class="nav">${[
 ["today","🏠",T("today")],["recovery","🤲",T("recovery")],["patterns","📊",T("patterns")],["history","🕘",T("history")],["settings","⚙️",T("settings")]
 ].map(x=>`<button class="${d.page===x[0]?"active":""}" onclick="nav('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}</nav>${modalHTML()}</div>`
}

function todayPage(){
 let n=nextPrayer(),c=completedToday(),pct=Math.round(c/5*100),q=qazaRemaining(),fast=d.fasting[todayKey()];
 return `<h1 class="page-title">${T("today")}</h1><p class="sub">${T("motivation")}</p>
 <section class="card hero"><div class="eyebrow">${T("next")}</div><div class="next"><div><h2>${n.p}</h2><div class="muted">${n.tomorrow?"Tomorrow":"Today"} · ${n.time}</div></div><span class="badge">${c}/5</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="row"><span class="muted">${pct}% ${T("completion")}</span><span class="muted">🔥 ${calcStreak()} ${T("streak")}</span></div><div class="heroBtns"><button class="btn" style="background:#fff;color:#075a4a" onclick="markPrayer('${n.p}')">${T("mark")}</button><button class="btn" style="background:rgba(255,255,255,.15);color:#fff" onclick="nav('recovery')">${T("qaza")}</button></div></section>
 <section class="card"><div class="row"><h3>${T("prayerTimes")}</h3><button class="btn soft tiny" onclick="refreshTimes()">↻</button></div>
 ${PRAYERS.map(p=>{let s=prayerState(p),r=rec(todayKey(),p),label=s==="completed"?T("completed"):s==="missed"?T("missed"):s==="recovered"?T("recovered"):s==="planned"?T("planned"):s==="past"?T("past"):T("upcoming");return `<div class="prayer"><div class="pname"><div class="picon">${ICONS[p]}</div><div><b>${p}</b><div class="ptime">${timesFor()[p]}</div></div></div><div><div class="status ${s==='completed'||s==='recovered'?'done':s==='missed'?'missed':s==='planned'?'planned':'upcoming'}">${label}</div>${s!=="completed"&&s!=="recovered"&&s!=="upcoming"?`<button class="btn soft tiny" style="margin-top:4px" onclick="markPrayer('${p}')">${T("mark")}</button>`:""}</div></div>`}).join("")}</section>
 <section class="card"><div class="grid2"><div class="mini"><span class="muted">🤲 ${T("qaza")}</span><b>${q}</b><span class="muted">${T("remaining")}</span></div><div class="mini"><span class="muted">🌙 ${T("fasting")}</span><b>${fast?"✓":"—"}</b><button class="btn soft tiny" onclick="toggleFast()">${fast?T("done"):T("add")}</button></div></div></section>
 <section class="section-head"><h3>${T("features")}</h3></section><section class="card featuregrid">
 <div class="feature" onclick="nav('recovery')">🤲<b>${T("qaza")}</b><span>${T("qazaDesc")}</span></div>
 <div class="feature" onclick="nav('patterns')">📊<b>${T("patterns")}</b><span>${T("last7")} & prayer consistency</span></div>
 <div class="feature" onclick="nav('history')">🧭<b>${T("qibla")}</b><span>Find the Qibla direction from your location.</span></div>
 <div class="feature" onclick="nav('settings')">🔒<b>${T("privacy")}</b><span>${T("privacyDesc")}</span></div></section>`
}

function recoveryPage(){
 let q=qazaTotal(),rem=qazaRemaining(),miss=d.records.filter(r=>r.status==="missed"&&r.recovery!=="completed");
 return `<h1 class="page-title">${T("recovery")}</h1><p class="sub">${T("qazaDesc")}</p>
 <section class="card hero"><div class="eyebrow">${T("qaza")}</div><h2>${rem}</h2><div class="muted">${T("remaining")} · ${q} ${T("count")}</div><div class="progress"><i style="width:${q?Math.min(100,Math.round((q-rem)/q*100)):0}%"></i></div><div class="row"><span class="muted">${recoveredCount()} ${T("recovered")}</span><button class="btn" style="background:#fff;color:#075a4a" onclick="addQaza()">+ ${T("add")}</button></div></section>
 <section class="card"><h3>${T("qaza")}</h3>${PRAYERS.map(p=>`<div class="listitem"><div class="row"><div><b>${ICONS[p]} ${p}</b><div class="muted">${T("target")}: ${d.qaza[p]||0}</div></div><div style="display:flex;gap:5px"><button class="btn soft tiny" onclick="setQaza('${p}',Math.max(0,(d.qaza['${p}']||0)-1));render()">−</button><button class="btn soft tiny" onclick="setQaza('${p}',(d.qaza['${p}']||0)+1);render()">+</button></div></div></div>`).join("")}</section>
 <section class="card"><div class="row"><h3>${T("missed")}</h3><span class="pill">${miss.length}</span></div>${miss.length?miss.slice().reverse().slice(0,12).map(r=>`<div class="listitem"><div class="row"><div><b>${r.prayer}</b><div class="muted">${fmt(r.date)} · ${r.reason||"—"}</div></div><button class="btn primary tiny" onclick="completeQaza('${r.prayer}')">${T("recovered")}</button></div></div>`).join(""):`<div class="empty"><div class="big">✨</div><b>${T("good")}</b><div class="muted">${T("motivation")}</div></div>`}</section>`
}

function last7(){
 let out=[],dt=new Date();for(let i=6;i>=0;i--){let x=new Date(dt);x.setDate(dt.getDate()-i);let k=todayKey(x),c=recordsFor(k).filter(r=>r.status==="completed").length;out.push({label:x.toLocaleDateString(d.lang,{weekday:"short"}),c})}return out
}
function insightsPage(){
 let top=null,counts={};d.records.forEach(r=>{if(r.reason)counts[r.reason]=(counts[r.reason]||0)+1});Object.entries(counts).forEach(x=>{if(!top||x[1]>top[1])top=x});
 let rate=completionRate();
 return `<h1 class="page-title">${T("patterns")}</h1><p class="sub">See your trends without turning worship into pressure.</p>
 <section class="card"><div class="grid3"><div class="stat"><b>${rate}%</b><span>${T("completion")}</span></div><div class="stat"><b>🔥 ${calcStreak()}</b><span>${T("streak")}</span></div><div class="stat"><b>${recoveredCount()}</b><span>${T("recovered")}</span></div></div></section>
 <section class="card"><h3>Prayer consistency</h3>${PRAYERS.map(p=>{let rs=d.records.filter(r=>r.prayer===p),cc=rs.filter(r=>r.status==="completed").length,rr=rs.length?Math.round(cc/rs.length*100):0;return `<div class="metric"><div class="row"><span>${ICONS[p]} ${p}</span><b>${rr}%</b></div><div class="bar" style="margin-top:7px"><i style="width:${rr}%"></i></div></div>`}).join("")}</section>
 <section class="card"><h3>${T("last7")}</h3>${last7().map(x=>`<div style="margin:10px 0"><div class="row"><span class="muted">${x.label}</span><span>${x.c}/5</span></div><div class="bar" style="margin-top:5px"><i style="width:${x.c*20}%"></i></div></div>`).join("")}</section>
 ${top?`<section class="card"><div class="row"><div><h3>${T("reflect")}</h3><b style="display:block;margin-top:6px">${top[0]}</b><span class="muted">${top[1]} times recorded</span></div><span style="font-size:30px">💡</span></div></section>`:""}
 <section class="card"><h3>🧭 ${T("qibla")}</h3><div class="qibla"><div class="muted">${T("qiblaFrom")} ${country()[0]}</div><div class="compass"><div class="needle" id="needle">➤</div></div><div class="degree" id="qdeg">—°</div><div class="muted">${T("direction")} ${T("degrees")}</div><button class="btn soft" style="margin-top:10px" onclick="useQibla()">${T("qibla")}</button></div></section>
 <section class="card"><div class="row"><div><h3>📿 ${T("tasbeeh")}</h3><div class="muted">${T("count")}: ${d.tasbeeh}</div></div><button class="btn primary" onclick="tasbeeh(33)">+33</button></div><div class="actions"><button class="btn soft" onclick="tasbeeh(1)">+1</button><button class="btn soft" onclick="tasbeeh(100)">+100</button><button class="btn danger" onclick="d.tasbeeh=0;save();render()">↺</button></div></section>`
}
function useQibla(){
 let done=(lat,lon)=>{let deg=Math.round(calculateQibla(lat,lon));document.getElementById("qdeg").textContent=deg+"°";document.getElementById("needle").style.setProperty("--angle",deg+"deg")};
 if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>done(p.coords.latitude,p.coords.longitude),()=>{done(country()[3],country()[4]);toast("Using country center")});else done(country()[3],country()[4])
}
function historyPage(){
 let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),cells=[];
 for(let i=0;i<start;i++)cells.push("<div></div>");
 for(let n=1;n<=dim;n++){let k=todayKey(new Date(y,m,n)),rs=recordsFor(k),c=rs.filter(r=>r.status==="completed").length,cl=c===5?"good":rs.some(r=>r.status==="missed")?"bad":c?"partial":"";cells.push(`<div class="day ${cl} ${k===todayKey()?"today":""}">${n}</div>`)}
 let days=[...new Set(d.records.map(r=>r.date))].sort().reverse();
 return `<h1 class="page-title">${T("history")}</h1><p class="sub">${T("privacyDesc")}</p>
 <section class="card"><div class="row" style="margin-bottom:10px"><b>${now.toLocaleDateString(d.lang,{month:"long",year:"numeric"})}</b><span class="muted">● ${T("completed")} · ● ${T("missed")}</span></div><div class="calendar">${["M","T","W","T","F","S","S"].map(x=>`<div class="calhead">${x}</div>`).join("")}${cells.join("")}</div></section>
 ${days.length?`<div class="section-head"><h3>Recent activity</h3></div>${days.slice(0,20).map(k=>{let rs=recordsFor(k),c=rs.filter(r=>r.status==="completed").length,mm=rs.filter(r=>r.status==="missed").length;return `<section class="card"><div class="row"><b>${fmt(k)}</b><span class="muted">${c} ✓ · ${mm} ×</span></div><div class="muted" style="margin-top:8px">${rs.map(r=>`${r.prayer} ${r.status==="completed"?"✓":"×"}`).join(" · ")}</div></section>`}).join("")}`:`<section class="card empty"><div class="big">🕘</div><b>No history yet</b><div class="muted">${T("motivation")}</div></section>`}`
}
function settingsPage(){
 return `<h1 class="page-title">${T("settings")}</h1><p class="sub">${T("languageDesc")}</p>
 <section class="card"><label>${T("location")} <select onchange="d.country=this.value;applyCountry()">${COUNTRIES.map(x=>`<option ${x[0]===d.country?"selected":""} value="${x[0]}">${x[0]} · ${x[1]}</option>`).join("")}</select></label><button class="btn soft full" onclick="useGeo()">📍 Use my approximate location</button></section>
 <section class="card"><label>${T("language")} <select onchange="setLangChoice(this.value)"><option value="country" ${d.langMode==="country"?"selected":""}>${T("countryDefault")}: ${LANG[countryLang()]?.name||countryLang()}</option>${SUPPORTED.map(x=>`<option value="${x}" ${d.langMode==="manual"&&d.lang===x?"selected":""}>${LANG[x].name}</option>`).join("")}</select></label></section>
 <section class="card"><label>${T("madhab")} <select onchange="d.madhab=this.value;d.times={};save();refreshTimes(true)"><option ${d.madhab==="Hanafi"?"selected":""}>Hanafi</option><option ${d.madhab==="Shafi"?"selected":""}>Shafi</option></select></label><label>${T("method")} <select onchange="d.manualMethod=this.value;d.times={};save();refreshTimes(true)">${METHODS.map(x=>`<option value="${x[1]}" ${String(d.manualMethod||"")===String(x[1])?"selected":""}>${x[0]}</option>`).join("")}</select></label></section>
 <section class="card"><div class="switch"><div><b>🔔 ${T("reminders")}</b><div class="muted">Browser reminders while this app is open.</div></div><input type="checkbox" ${d.notifications?"checked":""} onchange="toggleNotifications(this.checked)"></div><div class="switch" style="margin-top:16px"><div><b>🌙 ${T("ramadan")}</b><div class="muted">Adds fasting tracking to your daily dashboard.</div></div><input type="checkbox" ${d.ramadan?"checked":""} onchange="d.ramadan=this.checked;save();render()"></div></section>
 <section class="card"><h3>💾 ${T("backup")}</h3><p class="muted" style="margin:5px 0 12px">${T("privacyDesc")}</p><div class="actions"><button class="btn soft" onclick="exportData()">↥ ${T("export")}</button><button class="btn soft" onclick="document.getElementById('importFile').click()">↧ ${T("import")}</button></div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"></section>
 <section class="card"><div class="row"><div><b>🔒 ${T("privacy")}</b><div class="muted">${T("privacyDesc")}</div></div><span class="pill">${countryCode()}</span></div></section>
 <section class="card"><button class="btn danger full" onclick="resetData()">⚠ ${T("danger")}</button></section>`
}
function onboarding(){
 return `<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><section class="card" style="margin:0;width:100%;max-width:540px;text-align:center;padding:30px 22px"><div style="font-size:55px">🕌</div><h1 style="font-size:31px;margin:9px 0">${T("title")}</h1><p class="muted" style="line-height:1.55">${T("qazaDesc")}<br>57 OIC member countries • smart language defaults • private data.</p><label style="text-align:start;margin-top:22px">${T("choose")}<select id="ocountry">${COUNTRIES.map(x=>`<option ${x[0]===d.country?"selected":""}>${x[0]} · ${x[1]}</option>`).join("")}</select></label><label style="text-align:start">${T("madhab")}<select id="omadhab"><option>Hanafi</option><option>Shafi</option></select></label><button class="btn primary full" onclick="startApp()">${T("start")} →</button><div class="muted" style="margin-top:11px">No account required • Local-first • Export anytime</div></section></div>`
}
function startApp(){d.country=document.getElementById("ocountry").value;d.madhab=document.getElementById("omadhab").value;d.langMode="country";d.lang=countryLang();d.onboard=true;d.firstDay=todayKey();save();refreshTimes(true);render()}
function modalHTML(){
 if(!modal)return "";
 if(modal==="prayer")return `<div class="modal" onclick="if(event.target===this){modal=null;render()}"><div class="sheet"><h2>${ICONS[selected]} ${selected}</h2><div class="muted" style="margin-top:5px">${timesFor()[selected]} · ${fmt(todayKey())}</div><div class="actions"><button class="btn soft" onclick="modal=null;render()">${T("close")}</button><button class="btn primary" onclick="completePrayer()">${T("mark")} ✓</button></div><button class="btn danger full" style="margin-top:8px" onclick="modal='reason';render()">${T("miss")}</button></div></div>`;
 if(modal==="reason")return `<div class="modal"><div class="sheet"><h2>${T("reason")}</h2><div class="muted" style="margin-top:5px">${T("reflect")}</div><div class="options">${REASONS.map(x=>`<div class="option ${reason===x?"sel":""}" onclick="reason=${JSON.stringify(x)};render()">${x}${reason===x?" ✓":""}</div>`).join("")}</div><textarea id="reasonNote" placeholder="${T("note")}">${note}</textarea><div class="actions"><button class="btn soft" onclick="modal=null;reason='';render()">${T("close")}</button><button class="btn danger" onclick="recordMissed()">${T("record")}</button></div></div></div>`;
 if(modal==="qaza")return `<div class="modal"><div class="sheet"><h2>🤲 ${T("plan")}</h2><div class="muted">${T("target")}</div><div class="options">${PRAYERS.map(p=>`<div class="option ${selected===p?"sel":""}" onclick="selected='${p}';render()">${ICONS[p]} ${p} · ${d.qaza[p]||0}</div>`).join("")}</div><label style="margin-top:13px">${T("count")}<input id="qnum" type="number" min="1" value="1"></label><div class="actions"><button class="btn soft" onclick="modal=null;render()">${T("close")}</button><button class="btn primary" onclick="let n=Number(document.getElementById('qnum').value)||1;d.qaza[selected]=(d.qaza[selected]||0)+n;save();modal=null;toast(T('add'));render()">${T("save")}</button></div></div></div>`;
 return ""
}
function render(){
 document.body.className=d.theme==="dark"?"dark":"";
 let content=d.page==="today"?todayPage():d.page==="recovery"?recoveryPage():d.page==="patterns"?insightsPage():d.page==="history"?historyPage():settingsPage();
 document.getElementById("root").innerHTML=d.onboard?shell(content):onboarding()
}
render();setInterval(reminderCheck,30000);setTimeout(()=>{if(d.onboard&&!d.times[todayKey()])refreshTimes(true)},600);
</script>
</body>
</html>
