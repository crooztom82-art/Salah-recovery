*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:92px}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{padding:18px 16px 8px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);z-index:4}.title{font-size:23px;font-weight:800}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);margin:10px 14px;padding:16px;border-radius:20px;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 65%,transparent)}.hero{background:linear-gradient(135deg,#102a43,#285b78);color:white;overflow:hidden;position:relative}.hero:after{content:"☾";position:absolute;right:20px;top:10px;font-size:74px;opacity:.08}.hero .muted{color:#d4e3ed}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--soft);border-radius:15px;padding:12px;text-align:center}.stat b{font-size:21px;display:block}.progress,.bar{height:9px;background:#e5eaf0;border-radius:99px;overflow:hidden}.progress i,.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px}.prayer{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line)}.prayer:last-child{border-bottom:0}.pname{display:flex;align-items:center;gap:11px}.icon{width:38px;height:38px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:18px}.status{font-size:12px;font-weight:750}.done{color:var(--good)}.missed{color:var(--bad)}.planned{color:var(--brand2)}.upcoming{color:var(--muted)}.btn{border:0;border-radius:13px;padding:10px 13px;font <style id="salah-advanced-addon">

.advanced-strip .adv-title{font-size:18px;font-weight:800}.adv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.adv-chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px;text-align:left}.adv-chip b{display:block}.adv-chip span{font-size:12px;color:var(--muted)}
.adv-modal{position:fixed;inset:0;background:#06111dcc;z-index:30;display:grid;place-items:end center;padding:12px}.adv-sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--card);color:var(--text);border-radius:24px;padding:18px;box-shadow:0 20px 70px #0005}
.adv-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.adv-row:last-child{border-bottom:0}
.range{width:100%}.countdown-big{font-size:42px;font-weight:900;letter-spacing:-1px}.pulse{animation:salahPulse 1.8s infinite}@keyframes salahPulse{50%{transform:scale(1.025)}}
.adhan-player{padding:14px;border-radius:16px;background:var(--soft);margin-top:10px}.adv-note{font-size:12px;color:var(--muted);line-height:1.45}

      <div class="adv-row"><div><b>🔔 Prayer-time Adhan</b><div class="adv-note">Play the Adhan at the exact prayer time when the browser is allowed to run audio.</div></div><button class="switch ${d.adv.adhan?'on':''}" onclick="d.adv.adhan=!d.adv.adhan;advSave();render()"><i></i></button></div>
      <div class="adv-row"><div><b>⏳ Smart preparation alert</b><div class="adv-note">Extra 2-minute preparation cue in addition to the original reminder.</div></div><button class="switch ${d.adv.preAlert2?'on':''}" onclick="d.adv.preAlert2=!d.adv.preAlert2;advSave();render()"><i></i></button></div>
      <div class="adv-row"><div><b>📳 Haptic cue</b><div class="adv-note">Vibration pattern for preparation and prayer-time alerts.</div></div><button class="switch ${d.adv.vibrate?'on':''}" onclick="d.adv.vibrate=!d.adv.vibrate;advSave();render()"><i></i></button></div>
      <div class="adv-row"><div><b>📲 System notifications</b><div class="adv-note">Permission: ${esc(perm)}</div></div><button class="btn soft mini" onclick="advAskNotify()">Enable</button></div>
      <div class="adv-row"><div style="width:100%"><b>🔊 Adhan volume</b><input class="range" type="range" min="0" max="1" step=".05" value="${d.adv.soundLevel}" oninput="d.adv.soundLevel=+this.value;advSave()"></div></div>
      <div class="adv-row"><div style="width:100%"><b>⏰ Snooze duration</b><select onchange="d.adv.snooze=+this.value;advSave()"><option value="3" ${d.adv.snooze==3?'selected':''}>3 minutes</option><option value="5" ${d.adv.snooze==5?'selected':''}>5 minutes</option><option value="10" ${d.adv.snooze==10?'selected':''}>10 minutes</option><option value="15" ${d.adv.snooze==15?'selected':''}>15 minutes</option></select></div></div>
      <div class="adv-row"><div><b>🌙 Quiet mode</b><div class="adv-note">Silences only the new advanced layer. Your original app controls are unchanged.</div></div><button class="switch ${d.adv.quiet?'on':''}" onclick="d.adv.quiet=!d.adv.quiet;advSave();render()"><i></i></button></div>
      <div class="actions"><button class="btn soft" onclick="advStopAdhan()">⏹ Stop Adhan</button><button class="btn primary" onclick="enableRequiredAccess()">🔐 Allow access</button></div>
      <p class="adv-note" style="margin-bottom:0">Web browsers can suspend background JavaScript/audio when the screen is locked. For true OS-level alarms while the app is closed, this same interface should later be packaged as a native Android app/PWA with an alarm service.</p>
    </div></div>`;
    document.body.insertAdjacentHTML('beforeend',html);
  }
  function inject(){
    const root=document.getElementById('root');if(!root||!d.onboard)return;
    document.getElementById('advancedStrip')?.remove();
    const n=next();
    const box=document.createElement('section');box.id='advancedStrip';box.className='advanced-strip';
    box.innerHTML=`<div class="row"><div><div class="adv-title">✨ Smart Prayer Command Center</div><div class="muted">${n?`Next: ${esc(n.p)} · ${esc(t(n.p))} · ${diffText(n.time-new Date())}`:'Prayer schedule complete'} </div></div><button class="btn primary mini" onclick="advOpen()">Open</button></div><div class="adv-grid"><button class="adv-chip" onclick="advOpen()"><b>⏳ ${n?diffText(n.time-new Date()):'—'}</b><span>Next prayer</span></button><button class="adv-chip" onclick="advTestAdhan()">🕌 <b>Adhan</b><span>Test audio</span></button><button class="adv-chip" onclick="enableRequiredAccess()">🔐 <b>Access</b><span>Location + alerts</span></button><button class="adv-chip" onclick="d.adv.quiet=!d.adv.quiet;advSave();render()">🌙 <b>${d.adv.quiet?'Quiet on':'Quiet off'}</b><span>Advanced layer</span></button></div>`;
    if(page==='today'){const cards=root.querySelectorAll('.card');cards.length?cards[1]?.after(box):root.appendChild(box)}else root.prepend(box);
  }
  window.render=function(){OLD_RENDER();setTimeout(inject,0)};
  const oldCheck=window.checkAlarms;
  window.checkAlarms=function(){
    try{oldCheck()}catch(e){}
    if(!d.onboard||d.adv.quiet)return;
    const n=next();if(!n)return;
    const diff=n.time-new Date(), day=todayKey(), p=n.p;
    const twoKey=day+'-adv2-'+p, adKey=day+'-advadhan-'+p, sno=d.advSnooze;
    if(sno&&sno.p===p&&Date.now()>=sno.until){delete d.advSnooze;advSave();notify2('🕌 '+p+' prayer reminder','Your snoozed prayer reminder is due now.');beep(900,.8);vib([120,70,220]);toast('Snoozed reminder: '+p);}
    if(d.adv.preAlert2&&diff>90000&&diff<=120000&&sessionStorage.getItem(twoKey)!=='1'){
      sessionStorage.setItem(twoKey,'1');beep(660,.55);vib([80,40,80]);notify2('🧭 Prepare for '+p,p+' begins in about 2 minutes.');toast('2-minute preparation: '+p);
    }
    if(d.adv.adhan&&Math.abs(diff)<=45000&&sessionStorage.getItem(adKey)!=='1'){
      sessionStorage.setItem(adKey,'1');notify2('🕌 '+p+' — Adhan',`It is time for ${p}.`);playAdhan(p);toast('🕌 Adhan: '+p);
    }
  };
  setInterval(()=>{if(d.onboard){checkAlarms();scheduleNextAlarms();const e=document.getElementById('advancedStrip');if(e&&!document.hidden){const n=next();if(n){const m=e.querySelector('.adv-chip b');if(m)m.textContent=diffText(n.time-new Date())}}}},10000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkAlarms();if(d.onboard){primeAdhanAudio();scheduleNextAlarms();inject()}}});
  advSave();
  setTimeout(()=>{if(d.onboard){primeAdhanAudio();scheduleNextAlarms();inject()}},50);
})();
</script>
</body></html>
