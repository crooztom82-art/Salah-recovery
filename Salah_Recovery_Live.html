<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d4a7a"><title>Salah Recovery</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1a1a2e}button{font:inherit}
</style></head><body><div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const P=["Fajr","Dhuhr","Asr","Maghrib","Isha"];
const TIMES={Lahore:{Fajr:"5:00 AM",Dhuhr:"12:35 PM",Asr:"4:00 PM",Maghrib:"6:45 PM",Isha:"8:15 PM"},Karachi:{Fajr:"5:10 AM",Dhuhr:"12:45 PM",Asr:"4:10 PM",Maghrib:"6:55 PM",Isha:"8:25 PM"},Makkah:{Fajr:"4:30 AM",Dhuhr:"12:15 PM",Asr:"3:45 PM",Maghrib:"6:30 PM",Isha:"8:00 PM"},Madinah:{Fajr:"4:45 AM",Dhuhr:"12:20 PM",Asr:"3:50 PM",Maghrib:"6:35 PM",Isha:"8:05 PM"},Riyadh:{Fajr:"4:15 AM",Dhuhr:"12:00 PM",Asr:"3:30 PM",Maghrib:"6:15 PM",Isha:"7:45 PM"}};
const R=["Overslept","Forgot","Work","School","Travel","Health/personal circumstances","Family responsibilities","Lost track of time","No suitable place","Low motivation","Intentionally delayed","Other"];
const K="salah_recovery_live_v1", today=()=>new Date().toISOString().slice(0,10);
const initial={onboarding:false,location:"Lahore",records:[],dark:false,goals:[]};
function App(){const[d,setD]=useState(()=>{try{return {...initial,...JSON.parse(localStorage.getItem(K)||"{}")}}catch{return initial}});const[t,setT]=useState("Today");useEffect(()=>localStorage.setItem(K,JSON.stringify(d)),[d]);if(!d.onboarding)return <Onboard d={d} setD={setD}/>;return <div className={d.dark?"dark":""}><main className="min-h-screen bg-[#f8f6f2] dark:bg-[#12121e] text-[#1a1a2e] dark:text-[#eee] pb-24">{t==="Today"?<Today d={d} setD={setD}/>:t==="Recovery"?<Recovery d={d} setD={setD}/>:t==="Patterns"?<Patterns d={d}/>:t==="History"?<History d={d}/>:<Settings d={d} setD={setD}/>}</main><nav className="fixed bottom-0 left-0 right-0 bg-white dark:bg-[#1a1a2e] border-t border-black/10 dark:border-white/10 flex justify-around p-2 z-50">{["Today","Recovery","Patterns","History","Settings"].map(x=><button key={x} onClick={()=>setT(x)} className={"px-2 py-2 text-xs "+(t===x?"text-[#2d4a7a] font-bold":"text-gray-400")}>{x}</button>)}</nav></div>}
function Onboard({d,setD}){const[loc,setLoc]=useState("Lahore"),[goal,setGoal]=useState([]);return <div className="min-h-screen bg-[#f8f6f2] flex items-center justify-center p-5"><div className="max-w-md w-full text-center"><div className="text-5xl mb-5">🕌</div><h1 className="text-3xl font-bold mb-3">Salah Recovery</h1><p className="text-gray-500 mb-8">A private companion to stay consistent, recover missed salah, and understand your patterns.</p><div className="bg-white rounded-2xl p-5 text-left shadow-sm"><label className="text-sm font-semibold">City</label><select value={loc} onChange={e=>setLoc(e.target.value)} className="w-full mt-2 p-3 rounded-xl border">{Object.keys(TIMES).map(x=><option key={x}>{x}</option>)}</select><p className="text-sm font-semibold mt-5 mb-2">Your focus</p>{["Stay consistent","Recover missed salah","Build a stronger routine","Understand my patterns"].map(x=><button key={x} onClick={()=>setGoal(g=>g.includes(x)?g.filter(a=>a!==x):[...g,x])} className={"w-full text-left p-3 rounded-xl border mb-2 "+(goal.includes(x)?"border-[#2d4a7a] bg-blue-50":"border-gray-200")}>{goal.includes(x)?"✓ ":""}{x}</button>)}<button onClick={()=>setD({...d,onboarding:true,location:loc,goals:goal})} className="w-full mt-3 bg-[#2d4a7a] text-white p-3 rounded-xl font-semibold">Start My Journey</button></div></div></div>}
function Header({title,sub}){return <header className="max-w-lg mx-auto px-4 pt-6 pb-3"><h1 className="text-2xl font-bold">{title}</h1><p className="text-sm text-gray-500">{sub}</p></header>}
function Today({d,setD}){const[modal,setModal]=useState(null),[reason,setReason]=useState("");const date=today(),rs=d.records.filter(x=>x.date===date),done=rs.filter(x=>x.status==="completed").length,t=TIMES[d.location]||TIMES.Lahore;const save=s=>{setD({...d,records:[...d.records.filter(x=>!(x.date===date&&x.prayer===modal)),{date,prayer:modal,status:s,recovery:s==="missed"?"missed":"none",reason:s==="missed"?reason:null}]});setModal(null);setReason("")};return <><Header title="Assalamu Alaikum" sub={new Date().toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric",year:"numeric"})}/><section className="max-w-lg mx-auto px-4"><div className="bg-white rounded-2xl p-5 shadow-sm mb-3 flex justify-between"><div><p className="text-gray-500 text-sm">Today's Progress</p><b className="text-3xl">{done}/5</b><p className="text-[#2d4a7a] font-bold">{Math.round(done/5*100)}%</p></div><div className="w-16 h-16 rounded-full border-8 border-[#2d4a7a]/20 flex items-center justify-center font-bold text-[#2d4a7a]">{Math.round(done/5*100)}%</div></div>{P.map(p=>{const r=rs.find(x=>x.prayer===p),s=r?.recovery==="completed"?"Recovered":r?.status==="completed"?"Completed":r?.status==="missed"?"Missed":"Upcoming";return <button key={p} onClick={()=>!["Completed","Recovered"].includes(s)&&setModal(p)} className="w-full bg-white rounded-xl p-4 mb-2 flex justify-between shadow-sm"><span><b>{p}</b><small className="block text-gray-400">{t[p]}</small></span><span className={s==="Completed"?"text-green-600":s==="Missed"?"text-red-600":"text-gray-400"}>{s}</span></button>})}</section>{modal&&<div className="fixed inset-0 bg-black/50 flex items-end z-50"><div className="bg-white rounded-t-3xl w-full max-w-lg mx-auto p-5"><h2 className="text-xl font-bold">Mark {modal}</h2><button onClick={()=>save("completed")} className="w-full bg-green-600 text-white p-3 rounded-xl mt-4">Completed ✓</button><div className="grid gap-2 mt-3 max-h-52 overflow-auto">{R.map(x=><button key={x} onClick={()=>setReason(x)} className={"p-3 rounded-xl border text-left "+(reason===x?"border-blue-700 bg-blue-50":"")}>{x}</button>)}</div><button disabled={!reason} onClick={()=>save("missed")} className="w-full bg-red-600 disabled:bg-gray-300 text-white p-3 rounded-xl mt-3">Save as Missed</button><button onClick={()=>setModal(null)} className="w-full p-3 text-gray-500">Cancel</button></div></div>}</>}
function Recovery({d,setD}){const m=d.records.filter(x=>x.status==="missed");return <><Header title="Recovery" sub="Track and recover your missed salah."/><section className="max-w-lg mx-auto px-4">{m.length?m.map((r,i)=><div key={i} className="bg-white rounded-2xl p-4 mb-3 shadow-sm flex justify-between"><div><b>{r.prayer}</b><small className="block text-gray-400">{r.date} · {r.reason||"No reason"}</small></div>{r.recovery==="completed"?<span className="text-green-600 font-bold">Recovered ✓</span>:<button onClick={()=>setD({...d,records:d.records.map(x=>x===r?{...x,recovery:"completed"}:x)})} className="bg-green-600 text-white rounded-lg px-3">Recover</button>}</div>):<Empty text="No missed prayers to recover."/>}</section></>}
function Patterns({d}){const m=d.records.filter(x=>x.status==="missed"),count={};m.forEach(x=>count[x.prayer]=(count[x.prayer]||0)+1);const top=Object.entries(count).sort((a,b)=>b[1]-a[1])[0];return <><Header title="Patterns" sub="Gentle insights from your records."/><section className="max-w-lg mx-auto px-4"><div className="bg-white rounded-2xl p-5 shadow-sm"><p className="text-gray-500">Total missed</p><b className="text-3xl">{m.length}</b></div>{top&&<div className="bg-white rounded-2xl p-5 shadow-sm mt-3 border-l-4 border-[#2d4a7a]"><p className="text-gray-500">Most challenging prayer</p><b>{top[0]} · {top[1]} missed</b></div>}</section></>}
function History({d}){const ds=[...new Set(d.records.map(x=>x.date))].sort().reverse();return <><Header title="History" sub="Your journey, one day at a time."/><section className="max-w-lg mx-auto px-4">{ds.length?ds.map(x=><div key={x} className="bg-white rounded-2xl p-4 mb-2 flex justify-between"><b>{x}</b><span>{d.records.filter(r=>r.date===x&&r.status==="completed").length}/5 completed</span></div>):<Empty text="No history yet."/>}</section></>}
function Settings({d,setD}){return <><Header title="Settings" sub="Privacy and preferences."/><section className="max-w-lg mx-auto px-4"><div className="bg-white rounded-2xl p-4 shadow-sm flex justify-between"><span>Dark mode</span><input type="checkbox" checked={d.dark} onChange={e=>setD({...d,dark:e.target.checked})}/></div><div className="bg-white rounded-2xl p-4 shadow-sm mt-3"><b>Privacy</b><p className="text-sm text-gray-500 mt-1">Your records are stored locally on this device. No account is required.</p></div><button onClick={()=>{if(confirm("Delete all data?")){localStorage.removeItem(K);location.reload()}}} className="w-full mt-4 border border-red-500 text-red-600 p-3 rounded-xl">Delete All Data</button></section></>}
function Empty({text}){return <div className="bg-white rounded-2xl p-8 text-center text-gray-500">✓<p>{text}</p></div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
