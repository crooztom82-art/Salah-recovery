<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183153">
<title>Salah Recovery</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f7f5f0;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:84px}
header{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}
h1,h2,h3,p{margin:0}.title{font-size:22px;font-weight:750}.muted{color:#7d8491;font-size:13px}
.card{background:#fff;margin:10px 14px;padding:16px;border-radius:18px;box-shadow:0 3px 16px #00000009}
.hero{background:linear-gradient(135deg,#183153,#2e527e);color:#fff}.hero .muted{color:#d9e2ed}
.progress{height:8px;background:#dfe5ea;border-radius:99px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:#6f9ed0;border-radius:99px}
.next{display:flex;justify-content:space-between;align-items:center}.count{font-weight:700}
.prayer{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid #eee}.prayer:last-child{border:0}
.pname{display:flex;gap:12px;align-items:center}.icon{width:34px;height:34px;border-radius:12px;background:#edf2f7;display:grid;place-items:center}
.status{font-size:13px;font-weight:700}.done{color:#2d8a4e}.missed{color:#b33a3a}.planned{color:#4a7ab5}.upcoming{color:#888}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:650}.primary{background:#183153;color:#fff}.soft{background:#eef2f6;color:#183153}.danger{background:#b33a3a;color:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:#fff;border-top:1px solid #e8e8e8;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav button{background:none;border:0;color:#8b919c;font-size:11px;padding:5px}.nav button.active{color:#183153;font-weight:750}.nav span{display:block;font-size:20px;margin-bottom:2px}
.tabs{display:flex;gap:7px;overflow:auto;padding:2px 14px 8px}.tabs button{white-space:nowrap;border:0;border-radius:20px;padding:8px 14px;background:#ebe9e4;color:#68707d}.tabs .sel{background:#183153;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.bar{height:9px;background:#e9ecef;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#4a7ab5}
.modal{position:fixed;inset:0;background:#0008;display:grid;align-items:end;z-index:20}.sheet{background:#fff;border-radius:24px 24px 0 0;padding:22px;max-width:520px;width:100%;margin:auto;max-height:88vh;overflow:auto}
.option{padding:11px 13px;border:1px solid #ddd;border-radius:12px;margin:7px 0}.option.sel{border-color:#183153;background:#edf2f7}.actions{display:flex;gap:8px;margin-top:14px}.actions>*{flex:1}
select,textarea,input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fafafa;margin-top:6px}
.empty{text-align:center;padding:30px;color:#858b96}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f5f6f7;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}
.dark{background:#121522;color:#edf0f5}.dark .card,.dark .sheet,.dark .nav{background:#1b2030;color:#edf0f5}.dark .prayer{border-color:#303747}.dark .icon,.dark .stat,.dark .tabs button{background:#252c3b;color:#dfe5ee}.dark .muted{color:#9ba4b3}.dark input,.dark select,.dark textarea{background:#202635;color:#fff;border-color:#394153}.dark .option{border-color:#394153}.dark .option.sel{background:#263348}.dark .nav button.active{color:#9fc5ed}
</style>
</head>
<body>
<div id="root"></div>
<script>
const P=["Fajr","Dhuhr","Asr","Maghrib","Isha"], I={Fajr:"☀️",Dhuhr:"🌤️",Asr:"⛅",Maghrib:"🌙",Isha:"⭐"};
const TIMES={Karachi:{Fajr:"5:10 AM",Dhuhr:"12:45 PM",Asr:"4:10 PM",Maghrib:"6:55 PM",Isha:"8:25 PM"},Lahore:{Fajr:"5:00 AM",Dhuhr:"12:35 PM",Asr:"4:00 PM",Maghrib:"6:45 PM",Isha:"8:15 PM"},Makkah:{Fajr:"4:30 AM",Dhuhr:"12:15 PM",Asr:"3:45 PM",Maghrib:"6:30 PM",Isha:"8:00 PM"},Madinah:{Fajr:"4:45 AM",Dhuhr:"12:20 PM",Asr:"3:50 PM",Maghrib:"6:35 PM",Isha:"8:05 PM"},Riyadh:{Fajr:"4:15 AM",Dhuhr:"12:00 PM",Asr:"3:30 PM",Maghrib:"6:15 PM",Isha:"7:45 PM"},London:{Fajr:"5:45 AM",Dhuhr:"1:00 PM",Asr:"4:15 PM",Maghrib:"7:00 PM",Isha:"8:30 PM"},Dubai:{Fajr:"4:55 AM",Dhuhr:"12:25 PM",Asr:"3:55 PM",Maghrib:"6:40 PM",Isha:"8:10 PM"}};
const REASONS=["Overslept","Forgot","Work","School","Travel","Health/personal circumstances","Family responsibilities","Lost track of time","No suitable place","Low motivation","Intentionally delayed","Other"];
let d=JSON.parse(localStorage.getItem("salah_recovery_v3")||"null")||{onboard:false,city:"Karachi",madhab:"Hanafi",theme:"light",records:[],goals:[]};
let page="today", modal=null, selected=null, reason="";
function save(){localStorage.setItem("salah_recovery_v3",JSON.stringify(d))}
function date(){return new Date().toISOString().slice(0,10)}
function fmt(x){return new Date(x+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
function rec(p){return d.records.find(x=>x.date===date()&&x.prayer===p)}
function setRec(p,status,r=""){d.records=d.records.filter(x=>!(x.date===date()&&x.prayer===p));d.records.push({date:date(),prayer:p,status,recovery:"none",reason:r});save();render()}
function completed(){return d.records.filter(x=>x.date===date()&&x.status==="completed").length}
function missed(){return d.records.filter(x=>x.status==="missed")}
function timeDate(t,day=date()){let m=t.match(/(\d+):(\d+)\s*(AM|PM)/);let h=+m[1],mi=+m[2];if(m[3]=="PM"&&h<12)h+=12;if(m[3]=="AM"&&h==12)h=0;let x=new Date(day+"T00:00:00");x.setHours(h,mi,0,0);return x}
function status(p){let r=rec(p);if(r)return r.status==="completed"?"completed":r.recovery==="completed"?"recovered":r.recovery==="planned"?"planned":"missed";return timeDate(TIMES[d.city][p])<new Date()?"missed":"upcoming"}
function openModal(p){selected=p;reason=rec(p)?.reason||"";modal="prayer";render()}
function act(){if(modal==="prayer"){if(status(selected)==="upcoming"){setRec(selected,"completed");modal=null}else if(status(selected)==="missed"){modal="reason";render()}}}
function recover(mode){let r=d.records.find(x=>x.date===date()&&x.prayer===selected);if(r){r.recovery=mode;save()}modal=null;render()}
function nav(x){page=x;modal=null;render()}
function shell(content){return `<div class="app"><header><div><div class="title">Salah Recovery</div><div class="muted">${new Date().toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})}</div></div><button class="btn soft" onclick="toggleTheme()">☾</button></header>${content}<nav class="nav">${[['today','🏠','Today'],['recovery','🤲','Recovery'],['patterns','📊','Patterns'],['history','🕘','History'],['settings','⚙️','Settings']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="nav('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}</nav>${modalHtml()}</div>`}
function today(){let c=completed(),pct=Math.round(c/5*100),next=P.find(p=>status(p)==="upcoming");return `<section class="card hero"><div class="muted">Today's Progress</div><h2 style="font-size:30px;margin-top:4px">${c} / 5</h2><div class="progress"><div style="width:${pct}%"></div></div><div style="margin-top:8px">${pct}% complete</div></section><section class="card next"><div><div class="muted">Next Prayer</div><b>${next||"All prayers tracked"}</b>${next?` <span class="muted">${TIMES[d.city][next]}</span>`:""}</div><div class="count">${next?"Today":"✓"}</div></section><section class="card">${P.map(p=>{let s=status(p),label=s==="completed"?"Completed ✓":s==="recovered"?"Recovered ✓":s==="planned"?"Recovery Planned":s==="missed"?"Missed":"Upcoming";return `<div class="prayer" onclick="${s==="completed"||s==="recovered"?"":"openModal('"+p+"')"}"><div class="pname"><div class="icon">${I[p]}</div><div><b>${p}</b><div class="muted">${TIMES[d.city][p]}</div></div></div><span class="status ${s==="completed"?"done":s==="missed"?"missed":s==="planned"||s==="recovered"?"planned":"upcoming"}">${label}</span></div>`}).join("")}</section>`}
function recovery(){let a=missed();return `<h2 style="padding:10px 14px 0">Recovery</h2><p class="muted" style="padding:4px 14px 10px">Track missed salah and your recovery progress.</p>${a.length?`<section class="card">${a.sort((x,y)=>y.date.localeCompare(x.date)).map(r=>`<div class="prayer"><div><b>${r.prayer}</b><div class="muted">${fmt(r.date)} • ${r.reason||"No reason"}</div><div class="status ${r.recovery==="completed"?"done":"planned"}">${r.recovery==="completed"?"Recovered ✓":r.recovery==="planned"?"Planned":"Needs recovery"}</div></div>${r.recovery==="completed"?`<span>✓</span>`:`<div><button class="btn soft" onclick="selected='${r.prayer}';recover('planned')">Plan</button> <button class="btn primary" onclick="selected='${r.prayer}';recover('completed')">Recover</button></div>`}</div>`).join("")}</section>`:`<div class="card empty">🎉 No missed prayers recorded.<br><span class="muted">Keep going.</span></div>`}
function patterns(){let rs=d.records, counts=Object.fromEntries(P.map(p=>[p,{m:0,c:0}]));rs.forEach(r=>{if(counts[r.prayer])r.status==="missed"?counts[r.prayer].m++:r.status==="completed"&&(counts[r.prayer].c++)});let reasonCounts={};rs.filter(r=>r.status==="missed").forEach(r=>reasonCounts[r.reason]=(reasonCounts[r.reason]||0)+1);let top=Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1])[0];return `<h2 style="padding:10px 14px">Patterns</h2><section class="card"><h3>Prayer consistency</h3>${P.map(p=>{let x=counts[p],t=x.m+x.c,rate=t?Math.round(x.c/t*100):0;return `<div style="margin:14px 0"><div class="row"><span>${p}</span><b>${rate}%</b></div><div class="bar"><i style="width:${rate}%"></i></div></div>`}).join("")}</section>${top?`<section class="card"><h3>Common obstacle</h3><p style="margin-top:8px">${top[0]} · ${top[1]} time${top[1]>1?"s":""}</p></section>`:""}<section class="card"><div class="statgrid"><div class="stat"><b>${rs.length}</b><span class="muted">Tracked</span></div><div class="stat"><b>${missed().length}</b><span class="muted">Missed</span></div><div class="stat"><b>${missed().filter(x=>x.recovery==="completed").length}</b><span class="muted">Recovered</span></div></div></section>`}
function history(){let days=[...new Set(d.records.map(x=>x.date))].sort().reverse();return `<h2 style="padding:10px 14px">History</h2>${days.length?days.map(day=>{let rs=d.records.filter(x=>x.date===day),c=rs.filter(x=>x.status==="completed").length,m=rs.filter(x=>x.status==="missed").length;return `<section class="card"><div class="row"><b>${fmt(day)}</b><span class="muted">${c} completed · ${m} missed</span></div><div class="muted" style="margin-top:8px">${rs.map(r=>r.prayer+" "+(r.status==="completed"?"✓":"×")).join(" · ")}</div></section>`}).join(""):`<div class="card empty">No history yet.<br><span class="muted">Your tracked prayers will appear here.</span></div>`}
function settings(){return `<h2 style="padding:10px 14px">Settings</h2><section class="card"><label>Location<select onchange="d.city=this.value;save();render()">${Object.keys(TIMES).map(x=>`<option ${x===d.city?"selected":""}>${x}</option>`).join("")}</select></label><label style="display:block;margin-top:14px">Asr method<select onchange="d.madhab=this.value;save()"><option ${d.madhab==="Hanafi"?"selected":""}>Hanafi</option><option ${d.madhab==="Shafi"?"selected":""}>Shafi</option></select></label></section><section class="card"><div class="row"><div><b>Privacy first</b><div class="muted">Prayer records stay in this browser.</div></div><span>🔒</span></div></section><section class="card"><button class="btn danger" style="width:100%" onclick="if(confirm('Delete all Salah Recovery data?')){localStorage.removeItem('salah_recovery_v3');location.reload()}">Delete all data</button></section>`}
function modalHtml(){if(!modal)return"";if(modal==="prayer")return `<div class="modal" onclick="if(event.target===this){modal=null;render()}"><div class="sheet"><h2>${selected==="upcoming"?"":""} ${selected}</h2><p class="muted" style="margin-top:6px">${status(selected)==="upcoming"?"Mark this prayer as completed when you have prayed it.":"This prayer is recorded as missed."}</p><div class="actions">${status(selected)==="upcoming"?`<button class="btn soft" onclick="modal=null;render()">Cancel</button><button class="btn primary" onclick="act()">Complete ✓</button>`:`<button class="btn soft" onclick="modal=null;render()">Close</button><button class="btn primary" onclick="modal='reason';render()">Recovery →</button>`}</div></div></div>`;return `<div class="modal"><div class="sheet"><h2>What got in the way?</h2><p class="muted" style="margin:6px 0 12px">Choose a reason. This helps identify patterns.</p>${REASONS.map(x=>`<div class="option ${reason===x?"sel":""}" onclick="reason='${x.replace(/'/g,"\\'")}';render()">${x}${reason===x?" ✓":""}</div>`).join("")}<textarea placeholder="Optional note"></textarea><div class="actions"><button class="btn soft" onclick="modal=null;render()">Cancel</button><button class="btn danger" ${reason?"":"disabled"} onclick="setRec(selected,'missed',reason);modal='recovery';render()">Mark Missed</button></div></div></div>`}
function toggleTheme(){d.theme=d.theme==="dark"?"light":"dark";save();render()}
function onboarding(){return `<div style="min-height:100vh;display:grid;place-items:center;padding:24px"><section class="card" style="margin:0;width:100%;text-align:center;padding:28px"><div style="font-size:52px">🤲</div><h1 style="margin:12px 0 8px">Salah Recovery</h1><p class="muted">A private companion to help you stay consistent, recover missed salah, and understand your patterns.</p><label style="display:block;text-align:left;margin-top:24px">Your location<select id="ocity">${Object.keys(TIMES).map(x=>`<option ${x==="Karachi"?"selected":""}>${x}</option>`).join("")}</select></label><label style="display:block;text-align:left;margin-top:12px">Asr method<select id="omadhab"><option>Hanafi</option><option>Shafi</option></select></label><button class="btn primary" style="width:100%;margin-top:18px" onclick="d.city=ocity.value;d.madhab=omadhab.value;d.onboard=true;save();render()">Get Started</button></section></div>`}
function render(){document.body.className=d.theme==="dark"?"dark":"";document.getElementById("root").innerHTML=d.onboard?shell(page==="today"?today():page==="recovery"?recovery():page==="patterns"?patterns():page==="history"?history():settings()):onboarding()}
render();
</script>
</body>
</html>
