<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Salah Recovery Pro</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#182132;--muted:#7d8795;--brand:#17324f;--brand2:#315d87;--line:#e7e5df;--good:#2f8b52;--bad:#b43e3e;--gold:#b77a25}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:92px}
header{padding:20px 16px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800}.muted{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid #00000008;margin:10px 14px;padding:16px;border-radius:20px;box-shadow:0 5px 22px #00000008}
.hero{background:linear-gradient(140deg,#17324f,#315d87);color:#fff;border:0}.hero .muted{color:#d8e3ee}.hero h2{font-size:31px;margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:8px;background:#dce3e9;border-radius:99px;overflow:hidden;margin:11px 0}.progress i{display:block;height:100%;background:#a8c8e6}
.prayer{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line)}.prayer:last-child{border:0}.pinfo{display:flex;align-items:center;gap:11px}.ico{width:38px;height:38px;border-radius:13px;background:#edf2f6;display:grid;place-items:center}.status{font-size:12px;font-weight:750}.done{color:var(--good)}.bad{color:var(--bad)}.planned{color:#4a7ab5}.up{color:#8a919c}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700}.primary{background:var(--brand);color:#fff}.soft{background:#edf1f5;color:var(--brand)}.danger{background:var(--bad);color:#fff}.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:#8b929d;font-size:10px;padding:3px 6px}.nav button.active{color:var(--brand);font-weight:800}.nav span{display:block;font-size:20px}
.tabs{display:flex;gap:7px;padding:2px 14px 8px;overflow:auto}.tabs button{border:0;border-radius:18px;padding:8px 13px;background:#e9e7e1;color:#68717d;white-space:nowrap}.tabs .sel{background:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f3f5f6;border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:21px}
.bar{height:9px;background:#e7eaed;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand2)}
.modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end}.sheet{background:var(--card);border-radius:25px 25px 0 0;padding:22px;width:100%;max-width:560px;margin:auto;max-height:90vh;overflow:auto}.option{padding:11px;border:1px solid var(--line);border-radius:12px;margin:6px 0}.option.sel{border-color:var(--brand);background:#eef3f7}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fafafa;color:inherit;margin-top:5px}
.feature{display:grid;grid-template-columns:1fr 1fr;gap:9px}.feature .card{margin:0;padding:14px}.bigicon{font-size:27px}.qibla{height:190px;display:grid;place-items:center}.compass{width:145px;height:145px;border-radius:50%;border:7px solid #dfe6eb;display:grid;place-items:center;position:relative;background:radial-gradient(circle,#fff 0 52%,#eef3f7 53%)}.needle{font-size:52px;transform:rotate(0deg);transition:.4s}.small{font-size:11px}
.dark{--bg:#101522;--card:#1a2130;--ink:#eef2f6;--muted:#a0a9b7;--brand:#9ec5eb;--brand2:#6e9cca;--line:#30394a}.dark .ico,.dark .stat,.dark .tabs button{background:#242d3d}.dark .primary{background:#315d87;color:#fff}.dark input,.dark select,.dark textarea{background:#202837}.dark .nav button.active{color:#9ec5eb}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#172132;color:#fff;padding:11px 16px;border-radius:12px;z-index:50;display:none}
</style>
<style>
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#edf2f6;color:var(--brand);font-size:11px;font-weight:800}
.dark .badge{background:#242d3d}.coach{background:linear-gradient(135deg,#f1f6fa,#fff);border-left:4px solid var(--brand2)}.dark .coach{background:#202a39}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.heat i{height:25px;border-radius:7px;background:#e9ecef}.heat i.l1{background:#c8d8e5}.heat i.l2{background:#9fbcd3}.heat i.l3{background:#668fb2}.heat i.l4{background:#315d87}
.mini{font-size:12px;color:var(--muted)}.quote{font-size:15px;line-height:1.55}.checkrow{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.checkrow:last-child{border:0}
</style>

<link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body><div id="root"></div><div id="toast" class="toast"></div>
<script>
const PRAYERS=["Fajr","Dhuhr","Asr","Maghrib","Isha"], ICON={Fajr:"☀️",Dhuhr:"🌤️",Asr:"⛅",Maghrib:"🌙",Isha:"⭐"};
const FALLBACK={Karachi:{Fajr:"5:10 AM",Dhuhr:"12:45 PM",Asr:"4:10 PM",Maghrib:"6:55 PM",Isha:"8:25 PM"},Lahore:{Fajr:"5:00 AM",Dhuhr:"12:35 PM",Asr:"4:00 PM",Maghrib:"6:45 PM",Isha:"8:15 PM"},Makkah:{Fajr:"4:30 AM",Dhuhr:"12:15 PM",Asr:"3:45 PM",Maghrib:"6:30 PM",Isha:"8:00 PM"},Madinah:{Fajr:"4:45 AM",Dhuhr:"12:20 PM",Asr:"3:50 PM",Maghrib:"6:35 PM",Isha:"8:05 PM"},Riyadh:{Fajr:"4:15 AM",Dhuhr:"12:00 PM",Asr:"3:30 PM",Maghrib:"6:15 PM",Isha:"7:45 PM"},Dubai:{Fajr:"4:55 AM",Dhuhr:"12:25 PM",Asr:"3:55 PM",Maghrib:"6:40 PM",Isha:"8:10 PM"},London:{Fajr:"5:45 AM",Dhuhr:"1:00 PM",Asr:"4:15 PM",Maghrib:"7:00 PM",Isha:"8:30 PM"}};
const REASONS=["Overslept","Forgot","Work","School","Travel","Health/personal circumstances","Family responsibilities","Lost track of time","No suitable place","Low motivation","Intentionally delayed","Other"];
const DUA=[["Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina adhaban-nar","Our Lord, give us good in this world and good in the Hereafter, and protect us from the Fire."],["Rabbighfir li wa tub alayya innaka antat-Tawwabur-Rahim","My Lord, forgive me and accept my repentance. You are the One who accepts repentance, the Merciful."],["Hasbunallahu wa ni'mal wakeel","Allah is sufficient for us, and He is the best Disposer of affairs."]];
let data=JSON.parse(localStorage.getItem("salah_pro_4")||"null")||{city:"Karachi",method:1,madhab:"Hanafi",theme:"light",records:[],alarms:{enabled:true,minutes:10,adhan:true,vibrate:true},onboard:false,lat:null,lon:null,adhanData:null};
let page="today",modal=null,selected=null,reason="",timers={};let liveTimes=null;
function save(){localStorage.setItem("salah_pro_4",JSON.stringify(data))}
function today(){return new Date().toISOString().slice(0,10)} function fmt(x){return new Date(x+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
function toast(s){let e=document.getElementById("toast");e.textContent=s;e.style.display="block";setTimeout(()=>e.style.display="none",2600)}
function parse(t){let m=t.match(/(\d+):(\d+)\s*(AM|PM)/i);if(!m)return null;let h=+m[1],mi=+m[2];if(m[3].toUpperCase()=="PM"&&h<12)h+=12;if(m[3].toUpperCase()=="AM"&&h==12)h=0;return [h,mi]}
function dt(t,day=today()){let p=parse(t);if(!p)return null;let d=new Date(day+"T00:00:00");d.setHours(p[0],p[1],0,0);return d}
function recordsFor(day=today()){return data.records.filter(r=>r.date===day)}
function rec(p,day=today()){return data.records.find(r=>r.date===day&&r.prayer===p)}
function times(){return liveTimes||FALLBACK[data.city]||FALLBACK.Karachi}
function prayerStatus(p){let r=rec(p);if(r)return r.status==="completed"?"completed":r.recovery==="completed"?"recovered":r.recovery==="planned"?"planned":"missed";return dt(times()[p])<new Date()?"missed":"upcoming"}
function setRec(p,status,r=""){data.records=data.records.filter(x=>!(x.date===today()&&x.prayer===p));data.records.push({date:today(),prayer:p,status,recovery:"none",reason:r,updated:new Date().toISOString()});save()}
function recover(p,state){let r=rec(p);if(r){r.recovery=state;r.recoveredAt=state==="completed"?new Date().toISOString():r.recoveredAt;save();toast(state==="completed"?"Marked as recovered ✓":"Recovery planned");render()}}
function nav(x){page=x;modal=null;render()}
function toggleTheme(){data.theme=data.theme==="dark"?"light":"dark";save();render()}
async function getLocation(){if(!navigator.geolocation)return toast("Location is not supported here.");navigator.geolocation.getCurrentPosition(async pos=>{data.lat=pos.coords.latitude;data.lon=pos.coords.longitude;save();await fetchTimes();toast("Location & prayer times updated");render()},()=>toast("Location permission was not granted."))}
async function fetchTimes(){if(data.lat==null)return;try{let m=data.method||1;let url=`https://api.aladhan.com/v1/timings/${today()}?latitude=${data.lat}&longitude=${data.lon}&method=${m}`;let j=await fetch(url).then(r=>r.json());let x=j.data.timings;liveTimes={Fajr:to12(x.Fajr),Dhuhr:to12(x.Dhuhr),Asr:to12(x.Asr),Maghrib:to12(x.Maghrib),Isha:to12(x.Isha)};localStorage.setItem("salah_times_"+today(),JSON.stringify(liveTimes))}catch(e){toast("Could not refresh prayer times; using saved times.")}}
function to12(s){let m=s.match(/(\d+):(\d+)/);if(!m)return s;let h=+m[1],mi=m[2],ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${mi} ${ap}`}
function requestNotify(){if("Notification"in window)Notification.requestPermission().then(x=>toast(x==="granted"?"Notifications enabled ✓":"Notifications not enabled"))}
function playAdhan(){try{let C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(392,c.currentTime);o.frequency.exponentialRampToValueAtTime(262,c.currentTime+1.2);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+2.5);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+2.6);toast("Adhan alarm test");}catch(e){toast("Tap the page once, then test again.")}}
function checkAlarms(){if(!data.alarms.enabled)return;let now=new Date(),key=now.toISOString().slice(0,16);PRAYERS.forEach(p=>{let t=dt(times()[p]);if(!t)return;let diff=t-now, min=data.alarms.minutes*60000;if(Math.abs(diff-min)<30000&&!sessionStorage.getItem("pre"+key+p)){sessionStorage.setItem("pre"+key+p,"1");notify("Prayer soon",`${p} is in about ${data.alarms.minutes} minutes.`)}if(Math.abs(diff)<30000&&!sessionStorage.getItem("az"+key+p)){sessionStorage.setItem("az"+key+p,"1");notify("Adhan time",`${p} time has entered.`);if(data.alarms.adhan)playAdhan()}})}
function notify(title,body){if("Notification"in window&&Notification.permission==="granted")new Notification(title,{body});else toast(title+" — "+body)}
setInterval(checkAlarms,30000);
function countdown(next){let diff=Math.max(0,next?dt(times()[next])-new Date():0),h=Math.floor(diff/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);return next?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:"✓"}
function todayPage(){let rs=recordsFor(),c=rs.filter(r=>r.status==="completed").length,pct=Math.round(c/5*100),next=PRAYERS.find(p=>prayerStatus(p)==="upcoming");return `<section class="card hero"><div class="muted">Today's Progress</div><h2>${c} / 5</h2><div class="progress"><i style="width:${pct}%"></i></div><div>${pct}% complete</div></section>
<section class="card"><div class="row"><div><div class="muted">Next Prayer</div><b>${next||"All prayers tracked"}</b> ${next?`<span class="muted">${times()[next]}</span>`:""}</div><b>${countdown(next)}</b></div></section>
<section class="card">${PRAYERS.map(p=>{let s=prayerStatus(p),label={completed:"Completed ✓",missed:"Missed",recovered:"Recovered ✓",planned:"Recovery Planned",upcoming:"Upcoming"}[s];return `<div class="prayer" onclick="${s==="completed"||s==="recovered"?"":"openPrayer('"+p+"')"}"><div class="pinfo"><div class="ico">${ICON[p]}</div><div><b>${p}</b><div class="muted">${times()[p]}</div></div></div><span class="status ${s==="completed"?"done":s==="missed"?"bad":s==="planned"||s==="recovered"?"planned":"up"}">${label}</span></div>`}).join("")}</section>
<div class="feature" style="margin:10px 14px"><button class="card" onclick="page='qibla';render()"><span class="bigicon">🧭</span><br><b>Qibla</b><div class="muted">Find direction</div></button><button class="card" onclick="page='tasbeeh';render()"><span class="bigicon">📿</span><br><b>Tasbeeh</b><div class="muted">Digital counter</div></button></div>
<section class="card"><div class="muted">Daily reminder</div><h3 style="margin:5px 0">${DUA[new Date().getDate()%DUA.length][0]}</h3><p class="muted">${DUA[new Date().getDate()%DUA.length][1]}</p></section>`}
function recoveryPage(){let a=data.records.filter(r=>r.status==="missed").sort((x,y)=>y.date.localeCompare(x.date));return `<h2 style="padding:10px 14px">Recovery</h2><p class="muted" style="padding:0 14px 8px">A calm place to track missed salah and plan recovery.</p>${a.length?`<section class="card">${a.map(r=>`<div class="prayer"><div><b>${r.prayer}</b><div class="muted">${fmt(r.date)} • ${r.reason||"No reason"}</div><span class="status ${r.recovery==="completed"?"done":"planned"}">${r.recovery==="completed"?"Recovered ✓":r.recovery==="planned"?"Planned":"Needs recovery"}</span></div>${r.recovery==="completed"?"✓":`<div><button class="btn soft" onclick="data.records.find(x=>x.date==='${r.date}'&&x.prayer==='${r.prayer}').recovery='planned';save();render()">Plan</button> <button class="btn primary" onclick="data.records.find(x=>x.date==='${r.date}'&&x.prayer==='${r.prayer}').recovery='completed';save();render()">Recover</button></div>`}</div>`).join("")}</section>`:`<div class="card" style="text-align:center;padding:32px">🌿<br><b>No missed prayers recorded.</b><div class="muted">Keep going one prayer at a time.</div></div>`}
function patternsPage(){let counts=Object.fromEntries(PRAYERS.map(p=>[p,{c:0,m:0}]));data.records.forEach(r=>{if(counts[r.prayer])r.status==="completed"?counts[r.prayer].c++:r.status==="missed"&&counts[r.prayer].m++});let reasons={};data.records.filter(r=>r.status==="missed").forEach(r=>reasons[r.reason]=(reasons[r.reason]||0)+1);let top=Object.entries(reasons).sort((a,b)=>b[1]-a[1])[0];return `<h2 style="padding:10px 14px">Patterns</h2><section class="card"><h3>Prayer consistency</h3>${PRAYERS.map(p=>{let x=counts[p],t=x.c+x.m,rate=t?Math.round(x.c/t*100):0;return `<div style="margin:15px 0"><div class="row"><span>${p}</span><b>${rate}%</b></div><div class="bar"><i style="width:${rate}%"></i></div></div>`}).join("")}</section>${top?`<section class="card"><b>Most common obstacle</b><p style="margin-top:7px">${top[0]} · ${top[1]} time${top[1]>1?"s":""}</p></section>`:""}<section class="card"><div class="grid"><div class="stat"><b>${data.records.length}</b><span class="muted">Tracked</span></div><div class="stat"><b>${data.records.filter(r=>r.status==="missed").length}</b><span class="muted">Missed</span></div><div class="stat"><b>${data.records.filter(r=>r.recovery==="completed").length}</b><span class="muted">Recovered</span></div></div></section>`}
function historyPage(){let ds=[...new Set(data.records.map(r=>r.date))].sort().reverse();return `<h2 style="padding:10px 14px">History</h2>${ds.length?ds.map(x=>{let r=data.records.filter(z=>z.date===x),c=r.filter(z=>z.status==="completed").length;return `<section class="card"><div class="row"><b>${fmt(x)}</b><span class="muted">${c} completed</span></div><div class="muted" style="margin-top:8px">${r.map(z=>z.prayer+" "+(z.status==="completed"?"✓":"×")).join(" · ")}</div></section>`}).join(""):`<div class="card" style="text-align:center;padding:30px">Your history will appear here.</div>`}
function settingsPage(){return `<h2 style="padding:10px 14px">Settings</h2><section class="card"><b>Prayer Times</b><label class="muted" style="display:block;margin-top:10px">City<select onchange="data.city=this.value;liveTimes=null;save();render()">${Object.keys(FALLBACK).map(x=>`<option ${x===data.city?"selected":""}>${x}</option>`).join("")}</select></label><button class="btn primary" style="width:100%;margin-top:10px" onclick="getLocation()">📍 Use my current location</button><label class="muted" style="display:block;margin-top:12px">Calculation method<select onchange="data.method=+this.value;liveTimes=null;save();fetchTimes();render()"><option value="1" ${data.method===1?"selected":""}>Muslim World League</option><option value="2" ${data.method===2?"selected":""}>ISNA</option><option value="3" ${data.method===3?"selected":""}>Egyptian</option><option value="4" ${data.method===4?"selected":""}>Umm al-Qura</option><option value="5" ${data.method===5?"selected":""}>Karachi</option></select></label><label class="muted" style="display:block;margin-top:12px">Asr method<select onchange="data.madhab=this.value;save()"><option ${data.madhab==="Hanafi"?"selected":""}>Hanafi</option><option ${data.madhab==="Shafi"?"selected":""}>Shafi</option></select></label></section>
<section class="card"><div class="row"><div><b>Prayer alarms</b><div class="muted">Pre-prayer reminder + entry-time alarm</div></div><input style="width:45px" type="checkbox" ${data.alarms.enabled?"checked":""} onchange="data.alarms.enabled=this.checked;save()"></div><label class="muted" style="display:block;margin-top:12px">Remind me before prayer<select onchange="data.alarms.minutes=+this.value;save()">${[5,10,15,20,30].map(x=>`<option ${data.alarms.minutes===x?"selected":""}>${x}</option>`).join("")}</select></label><div class="row" style="margin-top:12px"><span>Adhan alarm</span><input style="width:45px" type="checkbox" ${data.alarms.adhan?"checked":""} onchange="data.alarms.adhan=this.checked;save()"></div><div class="row" style="margin-top:12px"><span>Vibration (where supported)</span><input style="width:45px" type="checkbox" ${data.alarms.vibrate?"checked":""} onchange="data.alarms.vibrate=this.checked;save()"></div><div class="actions" style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" onclick="requestNotify()">Enable notifications</button><button class="btn soft" onclick="playAdhan()">Test alarm</button></div></section>
<section class="card"><div class="row"><div><b>Appearance</b><div class="muted">Light / dark mode</div></div><button class="btn soft" onclick="toggleTheme()">${data.theme==="dark"?"Light":"Dark"}</button></div></section>
<section class="card"><b>Privacy</b><p class="muted" style="margin-top:5px">Your tracked prayer records are stored locally in this browser. Location is only used to request current prayer times when you choose it.</p><button class="btn danger" style="width:100%;margin-top:12px" onclick="if(confirm('Delete all app data?')){localStorage.removeItem('salah_pro_4');location.reload()}">Delete all data</button></section>`}
function qiblaPage(){return `<h2 style="padding:10px 14px">Qibla Finder</h2><section class="card qibla"><div class="compass"><div class="needle" id="needle">🕋</div></div></section><section class="card"><div class="row"><b>Qibla direction</b><b id="qdeg">--°</b></div><p class="muted" style="margin-top:8px">Allow location to calculate the direction from your current position. Device compass support varies by browser.</p><button class="btn primary" style="width:100%;margin-top:10px" onclick="calcQibla()">Calculate Qibla</button></section>`}
function calcQibla(){getLocation();setTimeout(()=>{if(data.lat==null)return;let la=data.lat*Math.PI/180,lo=data.lon*Math.PI/180,kla=21.4225*Math.PI/180,klo=39.8262*Math.PI/180;let y=Math.sin(klo-lo),x=Math.cos(la)*Math.tan(kla)-Math.sin(la)*Math.cos(klo-lo),deg=(Math.atan2(y,x)*180/Math.PI+360)%360;let e=document.getElementById("qdeg");if(e)e.textContent=Math.round(deg)+"° from North";let n=document.getElementById("needle");if(n)n.style.transform=`rotate(${deg}deg)`},800)}
function tasbeehPage(){let n=+(localStorage.getItem("tasbeeh")||0);return `<h2 style="padding:10px 14px">Digital Tasbeeh</h2><section class="card" style="text-align:center;padding:28px"><div class="muted">Count</div><div id="tc" style="font-size:64px;font-weight:800;margin:10px">${n}</div><button class="btn primary" style="width:100%;font-size:22px;padding:18px" onclick="let n=+(localStorage.getItem('tasbeeh')||0)+1;localStorage.setItem('tasbeeh',n);document.getElementById('tc').textContent=n;navigator.vibrate?.(20)">Tap to count</button><button class="btn soft" style="margin-top:10px" onclick="localStorage.setItem('tasbeeh',0);render()">Reset</button></section><section class="card"><b>Suggested dhikr</b><p class="muted" style="margin-top:7px">SubhanAllah · Alhamdulillah · Allahu Akbar</p></section>`}
function openPrayer(p){selected=p;reason=rec(p)?.reason||"";modal="prayer";render()}
function modalHtml(){if(!modal)return"";if(modal==="prayer"){let s=prayerStatus(selected);return `<div class="modal" onclick="if(event.target===this){modal=null;render()}"><div class="sheet"><h2>${selected}</h2><p class="muted" style="margin:6px 0 14px">${times()[selected]}</p>${s==="upcoming"?`<p>When you've prayed, mark it completed.</p><div class="actions"><button class="btn soft" onclick="modal=null;render()">Cancel</button><button class="btn primary" onclick="setRec(selected,'completed');modal=null;render()">Complete ✓</button></div>`:`<p>This prayer is recorded as missed.</p><div class="actions"><button class="btn soft" onclick="modal=null;render()">Close</button><button class="btn primary" onclick="modal='reason';render()">Add recovery →</button></div>`}</div></div>`}
return `<div class="modal"><div class="sheet"><h2>What got in the way?</h2><p class="muted" style="margin:6px 0 10px">This is for reflection, not judgment.</p>${REASONS.map(x=>`<div class="option ${reason===x?"sel":""}" onclick="reason='${x.replace(/'/g,"\\'")}';render()">${x}${reason===x?" ✓":""}</div>`).join("")}<div class="actions"><button class="btn soft" onclick="modal=null;render()">Cancel</button><button class="btn danger" ${reason?"":"disabled"} onclick="setRec(selected,'missed',reason);modal='recovery';render()">Mark missed</button></div></div></div>`}
function recoveryModal(){if(modal!=="recovery")return"";return `<div class="modal"><div class="sheet"><h2>Recovery</h2><p class="muted">Choose what you want to do next. Take it one step at a time.</p><div class="actions" style="display:block"><button class="btn primary" style="width:100%;margin-top:10px" onclick="recover(selected,'completed');modal=null;render()">I've handled this ✓</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="recover(selected,'planned');modal=null;render()">Plan my recovery</button><button class="btn soft" style="width:100%;margin-top:8px" onclick="modal=null;render()">Skip for now</button></div></div></div>`}
function shell(){let content=page==="today"?todayPage():page==="recovery"?recoveryPage():page==="patterns"?patternsPage():page==="history"?historyPage():page==="settings"?settingsPage():page==="qibla"?qiblaPage():tasbeehPage();return `<div class="app"><header><div><div class="brand">Salah Recovery</div><div class="muted">${new Date().toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})} · ${data.city}</div></div><button class="btn soft" onclick="toggleTheme()">☾</button></header>${content}<nav class="nav">${[['today','🏠','Today'],['recovery','🤲','Recovery'],['patterns','📊','Patterns'],['history','🕘','History'],['settings','⚙️','Settings']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="nav('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}</nav>${modalHtml()}${recoveryModal()}</div>`}
function onboarding(){return `<div style="max-width:560px;margin:auto;padding:30px 18px;min-height:100vh;display:grid;place-items:center"><section class="card" style="margin:0;text-align:center;padding:30px;width:100%"><div style="font-size:55px">🕌</div><h1>Salah Recovery Pro</h1><p class="muted" style="margin:8px 0 20px">Prayer tracking, recovery, reminders, Qibla and personal reflection — designed to stay private.</p><label class="muted" style="display:block;text-align:left">Choose city<select id="city">${Object.keys(FALLBACK).map(x=>`<option>${x}</option>`).join("")}</select></label><label class="muted" style="display:block;text-align:left;margin-top:10px">Asr method<select id="madhab"><option>Hanafi</option><option>Shafi</option></select></label><button class="btn primary" style="width:100%;margin-top:16px" onclick="data.city=city.value;data.madhab=madhab.value;data.onboard=true;save();requestNotify();render()">Get Started</button></section></div>`}

function daysBack(n){let a=[];for(let i=n-1;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);a.push(d.toISOString().slice(0,10))}return a}
function dayScore(day){let rs=data.records.filter(r=>r.date===day),c=rs.filter(r=>r.status==="completed").length,m=rs.filter(r=>r.status==="missed").length;return c*20-m*5}
function currentStreak(){let streak=0;for(let i=0;i<365;i++){let d=new Date();d.setDate(d.getDate()-i);let ds=d.toISOString().slice(0,10),rs=data.records.filter(r=>r.date===ds),c=rs.filter(r=>r.status==="completed").length;if(c>=5)streak++;else if(i>0)break}return streak}
function recoveryRate(){let m=data.records.filter(r=>r.status==="missed"),r=m.filter(x=>x.recovery==="completed");return m.length?Math.round(r.length/m.length*100):100}
function smartCoach(){let recent=daysBack(14),rs=data.records.filter(r=>recent.includes(r.date)),miss=rs.filter(r=>r.status==="missed");if(!miss.length)return "You're building a clean baseline. Protect the routine by preparing for your hardest prayer before its time.";let counts={};miss.forEach(r=>counts[r.prayer]=(counts[r.prayer]||0)+1);let p=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];let reasons={};miss.forEach(r=>{if(r.reason)reasons[r.reason]=(reasons[r.reason]||0)+1});let reason=Object.keys(reasons).sort((a,b)=>reasons[b]-reasons[a])[0];return reason?`${p} is your current pressure point, and “${reason}” appears most often. Try changing one small part of the routine before the next ${p}.`:`${p} is your current pressure point. Make the next ${p} easier by preparing one step early.`}
function reflectionCard(){let key="reflection_"+today(),val=localStorage.getItem(key)||"";return `<section class="card"><div class="row"><div><b>Daily intention</b><div class="muted">One small action for today</div></div><span class="badge">Private</span></div><input id="intent" value="${val.replace(/"/g,"&quot;")}" placeholder="e.g. Pause when the reminder arrives"><button class="btn soft" style="margin-top:8px;width:100%" onclick="localStorage.setItem('reflection_'+today(),document.getElementById('intent').value);toast('Intention saved ✓')">Save intention</button></section>`}
function todayPage(){let rs=recordsFor(),c=rs.filter(r=>r.status==="completed").length,pct=Math.round(c/5*100),st=currentStreak(),rr=recoveryRate(),next=PRAYERS.map(p=>({p,d:dt(times()[p])})).find(x=>x.d>new Date());return `<section class="card hero"><div class="muted">Today’s Salah Score</div><h2>${pct}/100</h2><div class="progress"><i style="width:${pct}%"></i></div><div class="row"><span class="mini">Consistency: <b>${st} day${st===1?"":"s"}</b></span><span class="mini">Recovery: <b>${rr}%</b></span></div></section><section class="card"><div class="row"><div><b>${next?next.p:"All prayers passed"}</b><div class="muted">${next?times()[next.p]:"Review your day"}</div></div><span class="badge">${next?"NEXT":"REVIEW"}</span></div></section><section class="card"><b>Today</b>${PRAYERS.map(p=>{let stt=prayerStatus(p);return `<div class="prayer" onclick="openPrayer('${p}')"><div class="pinfo"><div class="ico">${ICON[p]}</div><div><b>${p}</b><div class="muted">${times()[p]}</div></div></div><span class="status ${stt==="completed"?"done":stt==="recovered"?"planned":stt==="missed"?"bad":"up"}">${stt==="completed"?"Completed ✓":stt==="recovered"?"Recovered ✓":stt==="planned"?"Planned":stt==="missed"?"Missed":"Upcoming"}</span></div>`}).join("")}</section><section class="card coach"><div class="row"><b>Personal Coach</b><span>🧠</span></div><p class="quote">${smartCoach()}</p></section>${reflectionCard()}<section class="card"><div class="row"><div><b>Quick tools</b><div class="muted">No account required</div></div></div><div class="feature" style="margin-top:10px"><button class="card" onclick="nav('qibla')"><div class="bigicon">🧭</div><b>Qibla</b><div class="muted">Direction</div></button><button class="card" onclick="nav('tasbeeh')"><div class="bigicon">📿</div><b>Tasbeeh</b><div class="muted">Dhikr counter</div></button></div></section>`}
function patternsPage(){let ds=daysBack(28),vals=ds.map(d=>Math.max(0,Math.min(4,Math.round(dayScore(d)/20)))),miss=data.records.filter(r=>r.status==="missed"&&ds.includes(r.date)),counts={};miss.forEach(r=>counts[r.reason||"Other"]=(counts[r.reason||"Other"]||0)+1);let reason=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0]||"None yet";let hardest=PRAYERS.map(p=>[p,miss.filter(r=>r.prayer===p).length]).sort((a,b)=>b[1]-a[1])[0];return `<h2 style="padding:10px 14px">Patterns</h2><section class="card"><div class="row"><b>28-day rhythm</b><span class="badge">${data.records.length} logs</span></div><div class="heat">${vals.map(v=>`<i class="l${v}"></i>`).join("")}</div><div class="mini" style="margin-top:8px">Each square is a day; darker means more completed prayers.</div></section><section class="card"><b>What your data is saying</b><div class="checkrow">🎯 <span>Hardest prayer: <b>${hardest[0]}</b> (${hardest[1]} missed)</span></div><div class="checkrow">🧩 <span>Top obstacle: <b>${reason}</b></span></div><div class="checkrow">🔥 <span>Strong streak: <b>${currentStreak()} days</b></span></div><div class="checkrow">♻️ <span>Recovery rate: <b>${recoveryRate()}%</b></span></div></section><section class="card coach"><b>One-change experiment</b><p class="quote">For the next 7 days, change only one thing: prepare for <b>${hardest[0]}</b> ${reason!=="None yet"?"by addressing “"+reason+"”":"before its time"}.</p></section>`}
function settingsPage(){return `<h2 style="padding:10px 14px">Settings</h2><section class="card"><b>Prayer Times</b><label class="muted" style="display:block;margin-top:10px">City<select onchange="data.city=this.value;liveTimes=null;save();render()">${Object.keys(FALLBACK).map(x=>`<option ${x===data.city?"selected":""}>${x}</option>`).join("")}</select></label><button class="btn primary" style="width:100%;margin-top:10px" onclick="getLocation()">📍 Use my current location</button><label class="muted" style="display:block;margin-top:12px">Calculation method<select onchange="data.method=+this.value;liveTimes=null;save();fetchTimes();render()"><option value="1" ${data.method===1?"selected":""}>Muslim World League</option><option value="2" ${data.method===2?"selected":""}>ISNA</option><option value="3" ${data.method===3?"selected":""}>Egyptian</option><option value="4" ${data.method===4?"selected":""}>Umm al-Qura</option><option value="5" ${data.method===5?"selected":""}>Karachi</option></select></label><label class="muted" style="display:block;margin-top:12px">Asr method<select onchange="data.madhab=this.value;save()"><option ${data.madhab==="Hanafi"?"selected":""}>Hanafi</option><option ${data.madhab==="Shafi"?"selected":""}>Shafi</option></select></label></section><section class="card"><div class="row"><div><b>Smart alarms</b><div class="muted">Reminder + optional sound</div></div><input style="width:45px" type="checkbox" ${data.alarms.enabled?"checked":""} onchange="data.alarms.enabled=this.checked;save()"></div><label class="muted" style="display:block;margin-top:12px">Remind me before prayer<select onchange="data.alarms.minutes=+this.value;save()">${[5,10,15,20,30].map(x=>`<option ${data.alarms.minutes===x?"selected":""}>${x}</option>`).join("")}</select></label><div class="row" style="margin-top:12px"><span>Adhan-style test tone</span><input style="width:45px" type="checkbox" ${data.alarms.adhan?"checked":""} onchange="data.alarms.adhan=this.checked;save()"></div><div class="actions" style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" onclick="requestNotify()">Enable notifications</button><button class="btn soft" onclick="playAdhan()">Test</button></div></section><section class="card"><b>Personal data</b><p class="muted">Everything is kept in this browser. Export a backup before changing phones.</p><div style="display:flex;gap:8px;margin-top:10px"><button class="btn soft" onclick="exportBackup()">Export backup</button><button class="btn ghost" onclick="document.getElementById('imp').click()">Import</button></div><input id="imp" type="file" accept=".json" style="display:none" onchange="importBackup(this.files[0])"></section><section class="card"><div class="row"><div><b>Appearance</b><div class="muted">Light / dark mode</div></div><button class="btn soft" onclick="toggleTheme()">${data.theme==="dark"?"Light":"Dark"}</button></div></section><section class="card"><b>Privacy</b><p class="muted">No login, no advertising profile, no cloud account required.</p><button class="btn danger" style="width:100%;margin-top:12px" onclick="if(confirm('Delete all app data?')){localStorage.removeItem('salah_pro_4');location.reload()}">Delete all data</button></section>`}
function exportBackup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="salah-recovery-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Backup exported ✓")}
function importBackup(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.records||!x.city)throw 0;data=x;save();render();toast("Backup restored ✓")}catch(e){toast("Invalid backup file")}};r.readAsText(file)}
function shell(){let content=page==="today"?todayPage():page==="recovery"?recoveryPage():page==="patterns"?patternsPage():page==="history"?historyPage():page==="settings"?settingsPage():page==="qibla"?qiblaPage():tasbeehPage();return `<div class="app"><header><div><div class="brand">Salah Recovery</div><div class="muted">${new Date().toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})} · ${data.city}</div></div><button class="btn soft" onclick="toggleTheme()">☾</button></header>${content}<nav class="nav">${[['today','🏠','Today'],['recovery','🤲','Recovery'],['patterns','📊','Patterns'],['history','🕘','History'],['settings','⚙️','Settings']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="nav('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}</nav>${modalHtml()}${recoveryModal()}</div>`}
function render(){document.body.className=data.theme==="dark"?"dark":"";document.getElementById("root").innerHTML=data.onboard?shell():onboarding()}

let cached=localStorage.getItem("salah_times_"+today());if(cached)try{liveTimes=JSON.parse(cached)}catch(e){}render();
</script><script src="salah-recovery-advanced.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script></body></html>
